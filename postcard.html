<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>HTG Widokówka</title>
  <meta name="description" content="Pamiątkowa widokówka z misji HTG" />

  <link rel="stylesheet" href="./assets/postcard.css?v=20260730-1" />
</head>

<body>
  <main class="page">
    <article class="postcard" id="postcard" hidden>
      <img class="postcard__image" id="postcardImage" src="" alt="" />
    </article>

    <section class="fallback" id="fallback" hidden>
      <h1 id="fallbackTitle">Nie znaleziono widokówki</h1>
      <p id="fallbackText1">Link jest niepełny albo zawiera nieprawidłowe dane.</p>
      <p id="fallbackText2">Poprawny format adresu:</p>
      <code>postcard.html?year=1260&amp;lang=pl</code>
    </section>
  </main>

  <script>
    const CACHE_VERSION = "20260730-1";

    const POSTCARDS = {
      "1260": {
        title: { pl: "Początek na Kępie", en: "The beginning on Kępa" },
        alt: {
          pl: "Widokówka z epoki 1260, Początek na Kępie",
          en: "Postcard from 1260, The beginning on Kępa"
        }
      },
      "1750": {
        title: { pl: "Zakupy z całego świata", en: "Shopping from around the world" },
        alt: {
          pl: "Widokówka z epoki 1750, Zakupy z całego świata",
          en: "Postcard from 1750, Shopping from around the world"
        }
      },
      "1894": {
        title: { pl: "Architekt nowoczesnej Hali", en: "Architect of the modern market hall" },
        alt: {
          pl: "Widokówka z epoki 1894, Architekt nowoczesnej Hali",
          en: "Postcard from 1894, Architect of the modern market hall"
        }
      },
      "1896": {
        title: { pl: "Pierwszy dzień pod dachem", en: "The first day under the roof" },
        alt: {
          pl: "Widokówka z epoki 1896, Pierwszy dzień pod dachem",
          en: "Postcard from 1896, The first day under the roof"
        }
      },
      "1931": {
        title: { pl: "Restaurator z Hali", en: "The restaurateur from the market hall" },
        alt: {
          pl: "Widokówka z epoki 1931, Restaurator z Hali",
          en: "Postcard from 1931, The restaurateur from the market hall"
        }
      },
      "1975": {
        title: { pl: "Zapach mandarynek", en: "The scent of mandarins" },
        alt: {
          pl: "Widokówka z epoki 1975, Zapach mandarynek",
          en: "Postcard from 1975, The scent of mandarins"
        }
      }
    };

    const COPY = {
      pl: {
        invalidTitle: "Nie znaleziono widokówki | HTG",
        fallbackTitle: "Nie znaleziono widokówki",
        fallbackText1: "Link jest niepełny albo zawiera nieprawidłowe dane.",
        fallbackText2: "Poprawny format adresu:"
      },
      en: {
        invalidTitle: "Postcard not found | HTG",
        fallbackTitle: "Postcard not found",
        fallbackText1: "The link is incomplete or contains invalid data.",
        fallbackText2: "Correct URL format:"
      }
    };

    const params = new URLSearchParams(window.location.search);
    const requestedYear = params.get("year");
    const requestedLang = (params.get("lang") || "pl").toLowerCase() === "en"
      ? "en"
      : "pl";
    const copy = COPY[requestedLang];

    document.documentElement.lang = requestedLang;

    const postcard = POSTCARDS[requestedYear];
    const postcardElement = document.getElementById("postcard");
    const fallbackElement = document.getElementById("fallback");

    if (!postcard) {
      document.title = copy.invalidTitle;
      document.getElementById("fallbackTitle").textContent = copy.fallbackTitle;
      document.getElementById("fallbackText1").textContent = copy.fallbackText1;
      document.getElementById("fallbackText2").textContent = copy.fallbackText2;
      fallbackElement.hidden = false;
    } else {
      const imageSuffix = requestedLang === "en" ? "en" : "";
      const image = document.getElementById("postcardImage");

      document.title = `${postcard.title[requestedLang]} | HTG`;
      image.src = `./images/${requestedYear}${imageSuffix}.png?v=${CACHE_VERSION}`;
      image.alt = postcard.alt[requestedLang];

      postcardElement.hidden = false;
    }
  </script>
</body>
</html>
